name: Build CineStream Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Environment Variables
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://atzrtfdeokapvrwilobu.supabase.co' }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0enJ0ZmRlb2thcHZyd2lsb2J1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNzI2NzIsImV4cCI6MjEwNTY0ODY3Mn0._MHwNJLIbZkj-eVy0aNHw7YjOpjYwQbhQ6sh2BTqgH8' }}" >> .env
          echo "WEBSITE_WATCH_BASE_URL=https://cinestream-movie-str-4phw.bolt.host/watch" >> .env

      - name: Setup Keystore for Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle :app:assembleRelease --stacktrace

      - name: Build Release AAB (App Bundle)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:bundleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Release AAB (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
